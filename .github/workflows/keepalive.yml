# يمنع إيقاف قاعدة بيانات Supabase المجانية بسبب قلة النشاط
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 6 * * 1,4"   # الاثنين والخميس
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the database
        run: |
          curl -fsS "https://jtzhbriuagqhgyktjpox.supabase.co/rest/v1/events?select=id&limit=1" \
            -H "apikey: sb_publishable_ADXXZGOTXRKDC2xbfU3llQ_-CA0WfE4" > /dev/null
          echo "Supabase is awake"
